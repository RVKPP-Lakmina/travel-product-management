services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: travel-api-dev
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - pnpm_store:/root/.local/share/pnpm/store
    ports:
      - "3000:3000"
    env_file:
      - ../apps/api/.env
    environment:
      SUPABASE_URL: ${API_SUPABASE_URL:-http://host.docker.internal:54321}
    extra_hosts:
      - host.docker.internal:host-gateway
    command: pnpm --filter api start:dev

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: travel-web-dev
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - pnpm_store:/root/.local/share/pnpm/store
    ports:
      - "5173:5173"
    env_file:
      - ../apps/web/.env
    command: pnpm --filter web dev --host 0.0.0.0

volumes:
  pnpm_store:
