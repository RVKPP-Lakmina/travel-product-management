# Runs under nginxinc/nginx-unprivileged:alpine (see apps/web/Dockerfile's
# production stage) on port 8080 -- no root, no CAP_NET_BIND_SERVICE needed
# for a port below 1024.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # security-headers.conf is included explicitly in each STATIC location
    # below (index.html, assets, the SPA-fallback root) rather than once
    # here at server level. Deliberately NOT included at this level: nginx
    # `add_header` doesn't replace a same-named header already present on
    # the response, it appends a second copy -- so a server-level include
    # would double up every security header on the /api/ proxy responses,
    # which already carry a full set from the backend's own helmet
    # middleware (apps/api/src/main.ts).

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Reverse-proxy /api/* to the Nest service -- makes the browser's calls
    # same-origin, so the API's CORS allowlist can stay tight and simple.
    # `api` resolves via Docker Compose's internal DNS to the api service.
    # No security-headers.conf include here -- see the note above.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed static assets: cache forever, immutable.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must always revalidate -- it's the one file whose content
    # changes on every deploy without a new filename.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback -- client-side routing (react-router) owns every path
    # that isn't a real static file.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
