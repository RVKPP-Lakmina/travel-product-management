# Included from every `location` block that itself sets an `add_header`
# (default.conf's /index.html and /assets/ blocks) as well as the server
# block's default location. This file exists because of a classic nginx
# gotcha: `add_header` directives are inherited from an enclosing `server`
# block ONLY if the current `location` block defines none of its own -- a
# location with even one `add_header` (e.g. a Cache-Control override)
# silently drops every server-level header, security headers included.
# Including this file explicitly in each such location sidesteps that
# inheritance rule entirely rather than relying on it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header X-Frame-Options "DENY" always;
