packages:
  - "apps/*"
  - "packages/*"

overrides:
  typescript: 6.0.3
  zod: 4.5.4

# Lifecycle (postinstall) scripts are blocked by default in modern pnpm —
# good, that's a real supply-chain control. esbuild is the one dependency
# (via tsup) that legitimately needs its install script to fetch its
# platform binary, so it's explicitly allowlisted rather than disabling the
# protection globally.
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@supabase/auth-js@2.116.0'
  - '@supabase/functions-js@2.116.0'
  - '@supabase/postgrest-js@2.116.0'
  - '@supabase/realtime-js@2.116.0'
  - '@supabase/storage-js@2.116.0'
  - '@supabase/supabase-js@2.116.0'
  - lucide-react@1.43.0
